# Martin tile server config.
#
# Martin auto-publishes table-functions in the earthquake schema so the
# frontend can request vector tiles for any catalog via /tiles_zxy/{z}/{x}/{y}.
#
# Listening on :3000 inside the container matches the host port mapping in
# docker-compose.prod.yml (3000:3000) and the /tiles_zxy/* behavior on the
# CloudFront distribution.
listen_addresses: '0.0.0.0:3000'
web_ui: enable-for-all

postgres:
  connection_string: "postgresql://postgres:postgres@postgis-eq:5432/gis?sslmode=disable"

  auto_publish:
    from_schemas:
      - earthquake
    tables: false
    functions: true
